name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: loomid-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: loomid-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loomid
          POSTGRES_PASSWORD: loomid
          POSTGRES_DB: loomid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomid -d loomid_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: loomid-api
    env:
      TEST_DATABASE_URL: postgresql://loomid:loomid@localhost:5432/loomid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: loomid-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  bundled-ui:
    name: Bundled UI matches root files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare copies
        run: |
          diff index.html loomid-api/static/index.html
          diff prd.html loomid-api/static/prd.html

  docker:
    name: Docker image and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loomid-api ./loomid-api

      - name: Run the image (demo SQLite mode)
        run: |
          docker run -d --name api -p 8000:8000 loomid-api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 1; done
          curl -fsS http://localhost:8000/health
          curl -fsS "http://localhost:8000/identity/lookup?identifier=jordyn@personalmail.com" | grep PER-4471
          docker logs api
          docker rm -f api

      - name: Compose up with Postgres
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break || sleep 2; done
          curl -fsS "http://localhost:8000/identity/lookup?identifier=jordyn@personalmail.com" | grep PER-4471
          docker compose logs api
          docker compose down -v
